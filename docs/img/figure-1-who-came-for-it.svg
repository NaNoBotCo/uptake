<title id="t">Unique cloners against unique page viewers, by repository</title><desc id="d">Sixteen repositories. The honey bars are distinct machines that cloned the repository; the thin grey bars are distinct browsers that loaded its GitHub page. Most repositories show double-digit cloners against zero viewers.</desc>
